# Cấu hình tham khảo nếu cài đặt Eclipse Mosquitto trực tiếp trên VPS
# Lưu ý: Không chạy allow_anonymous true trên IP public mà phải tạo file mật khẩu bằng mosquitto_passwd!

listener 1883 0.0.0.0
allow_anonymous false
password_file C:\mosquitto\passwd.txt

# Listener WebSocket nội bộ (dành cho FastAPI hoặc Cloudflare Tunnel)
listener 9001 127.0.0.1
protocol websockets
allow_anonymous false
password_file C:\mosquitto\passwd.txt

persistence true
persistence_location C:\mosquitto\data\
log_dest file C:\mosquitto\log\mosquitto.log
