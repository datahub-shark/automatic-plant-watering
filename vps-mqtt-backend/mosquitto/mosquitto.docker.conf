# Cấu hình Eclipse Mosquitto dùng bên trong Docker Compose (profile: local-mqtt)
listener 1883
listener 9001
protocol websockets

# LƯU Ý BẢO MẬT: Nếu mở cổng 1883 ra ngoài Internet (hoặc xin NAT port trên VPS),
# hãy đổi thành allow_anonymous false và tạo file mật khẩu bằng mosquitto_passwd -c passwd.txt <user>
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
